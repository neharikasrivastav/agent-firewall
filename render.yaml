# Render Blueprint: deploys the public playground (no real tools, no state) on the free plan.
services:
  - type: web
    name: agent-firewall
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn agent_firewall.playground:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
