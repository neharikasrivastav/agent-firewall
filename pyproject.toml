[project]
name = "agent-firewall"
version = "0.1.0"
description = "A prompt-injection firewall for AI agents: an MCP proxy that scans tool outputs, gates risky actions behind human approval, and logs every decision."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agent-firewall = "agent_firewall.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_firewall*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
